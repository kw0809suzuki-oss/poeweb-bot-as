name: Poe Astra offline checks

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: python -m compileall -q poe_astra main.py modal_deploy.py tests
      - name: Offline contract tests
        run: python -m unittest discover -s tests -v
