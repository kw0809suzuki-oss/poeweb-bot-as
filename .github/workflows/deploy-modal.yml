name: Deploy Poe Astra to Modal

# The deploy runs in GitHub's Linux runner, not on a user's Windows computer.
on:
  push:
    branches: [main]
    paths:
      - "poe_astra/**"
      - "modal_deploy.py"
      - "requirements.txt"
      - ".github/workflows/deploy-modal.yml"
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-flight deployment with a later push.
concurrency:
  group: poe-astra-modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out Poe Astra
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check syntax
        run: python -m compileall -q poe_astra modal_deploy.py tests

      - name: Run offline contract tests
        run: python -m unittest discover -s tests -v

      - name: Check Modal deployment credentials
        shell: bash
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::Deployment was NOT performed: MODAL_TOKEN_ID or MODAL_TOKEN_SECRET is missing. Set both as GitHub Actions repository secrets."
            exit 1
          fi

      - name: Install Modal
        run: python -m pip install "modal>=1,<2"

      - name: Deploy Poe Astra to Modal
        run: python -m modal deploy modal_deploy.py

      - name: Verify app in the deploy token's Modal workspace
        run: |
          python -m modal app info poe-astra
          echo "App is deployed in the Modal workspace associated with these GitHub secrets."
          echo "If the app is missing from the Modal browser dashboard, check that the browser shows this same workspace and environment."
